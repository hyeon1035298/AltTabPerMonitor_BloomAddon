# The add-on's names, set here only. build.sh hands this file to PillTaskbar's
# tools/build-addon.sh, whose addon/addon.conf describes every key.
# Paths are relative to this file's folder. Lists are space separated.

ADDON_ID="alt-tab-per-monitor"
ADDON_NAME="AltTabPerMonitor"
ADDON_VERSION="1.2.1-2"
ADDON_MOD_SRC="mod/alt-tab-per-monitor.wh.cpp"
ADDON_MOD_VERSION="1.2.1"
# The mod as Windhawk lists it and as a local Windhawk build: the add-on refuses to
# start while either is on in Windhawk.
ADDON_WINDHAWK_MODS="alt-tab-per-monitor local@alt-tab-per-monitor"
ADDON_SYMBOL_MODULES="twinui.pcshell.dll"
# Bloom has no settings page for this add-on.
ADDON_SCHEMA="0"
# Built-in defaults that replace the mod's own: Win+Alt+Tab also follows the cursor.
ADDON_VALUES_DEFAULTS="defaults.json"
ADDON_THIRD_PARTY="THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="모니터별 Alt+Tab"
ADDON_NAME_EN="Alt+Tab per monitor"
ADDON_ABOUT_KO="Alt+Tab에 커서가 있는 모니터의 창만 보입니다"
ADDON_ABOUT_EN="Alt+Tab shows only the windows on the monitor under the cursor"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/AltTabPerMonitor_BloomAddon"
ADDON_MIN_BLOOM="0.19.0"
ADDON_NEEDS=""
